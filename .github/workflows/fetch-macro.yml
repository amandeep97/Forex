name: Fetch Macro Data

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours
  workflow_dispatch:          # Allow manual trigger from GitHub UI

jobs:
  fetch-macro:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # main, explicitly. A scheduled run checks out the DEFAULT branch,
          # which here is the bot's source branch — so this fetched macro data
          # and committed it somewhere the app never reads. macroDrivers.js
          # loads public/macro-data.json from main, and the copy there was six
          # days behind the copy on the branch this was writing to.
          ref: main

      - name: Fetch macro data
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, os
          from datetime import datetime, timezone, timedelta

          # ── BLS (US Bureau of Labor Statistics) ── no key, no account needed ──
          def fetch_bls_cpi():
              # CUSR0000SA0 = CPI-U All Items Seasonally Adjusted
              url = "https://api.bls.gov/publicAPI/v1/timeseries/data/CUSR0000SA0"
              try:
                  req = urllib.request.Request(
                      url,
                      data=json.dumps({"seriesid": ["CUSR0000SA0"]}).encode(),
                      headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"},
                  )
                  with urllib.request.urlopen(req, timeout=30) as r:
                      payload = json.loads(r.read().decode())
                  rows = payload["Results"]["series"][0]["data"]
                  result = []
                  for row in rows:
                      if row["period"] == "M13":   # annual average — skip
                          continue
                      if row.get("value") in ("-", "N/A", ""):   # unreleased month
                          continue
                      month = row["period"][1:]     # "M01" → "01"
                      date = f"{row['year']}-{month}-01"
                      result.append({"date": date, "val": float(row["value"])})
                  result.sort(key=lambda x: x["date"])
                  return result if result else None
              except Exception as e:
                  print(f"  WARN: BLS CPI failed: {e}")
                  return None

          # ── Yahoo Finance ── works from GitHub Actions (no block, no key) ──
          def fetch_yahoo(ticker, limit=365):
              url = (
                  f"https://query1.finance.yahoo.com/v8/finance/chart/{ticker}"
                  f"?range=2y&interval=1d&includePrePost=false"
              )
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = json.loads(r.read().decode())
                  result_obj = data["chart"]["result"][0]
                  timestamps = result_obj["timestamp"]
                  closes = result_obj["indicators"]["quote"][0]["close"]
                  result = []
                  for ts, val in zip(timestamps, closes):
                      if val is None:
                          continue
                      date = datetime.fromtimestamp(ts, tz=timezone.utc).strftime("%Y-%m-%d")
                      result.append({"date": date, "val": round(val, 4)})
                  return result[-limit:] if result else None
              except Exception as e:
                  print(f"  WARN: Yahoo {ticker} failed: {e}")
                  return None

          # Normalise ^TNX / ^IRX: Yahoo returns e.g. 43.5 meaning 4.35%
          def fetch_yield(ticker, limit=365):
              data = fetch_yahoo(ticker, limit)
              if not data:
                  return None
              return [{"date": d["date"], "val": round(d["val"] / 10, 4) if d["val"] > 20 else d["val"]} for d in data]

          # ── FRED CSV ── may time-out from datacenter IPs; kept as opportunistic ──
          def fetch_fred_csv(series_id, days=540):
              url = f"https://fred.stlouisfed.org/graph/fredgraph.csv?id={series_id}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      text = r.read().decode()
                  result = []
                  for line in text.strip().split("\n")[1:][-days:]:
                      parts = line.split(",")
                      if len(parts) == 2:
                          try:
                              result.append({"date": parts[0].strip(), "val": float(parts[1])})
                          except (ValueError, IndexError):
                              pass
                  return result if result else None
              except Exception as e:
                  print(f"  WARN: FRED {series_id}: {e}")
                  return None

          # ── Stooq CSV ── reliable from GitHub Actions (no block, no key) ──
          # Economic indicators: close column (index 4) is the value.
          def fetch_stooq(symbol, limit=365):
              url = f"https://stooq.com/q/d/l/?s={symbol}&i=d"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      text = r.read().decode()
                  result = []
                  lines = text.strip().split("\n")
                  for line in lines[1:]:          # skip header
                      parts = line.split(",")
                      if len(parts) >= 5:
                          try:
                              val = float(parts[4])  # Close
                              result.append({"date": parts[0].strip(), "val": round(val, 4)})
                          except (ValueError, IndexError):
                              pass
                  result.sort(key=lambda x: x["date"])
                  return result[-limit:] if result else None
              except Exception as e:
                  print(f"  WARN: Stooq {symbol}: {e}")
                  return None

          # ── US Treasury real yield XML ── field_tdr_date_value=YYYY (4-digit year) ──
          def fetch_treasury_real_yield_10y(years_back=2):
              import xml.etree.ElementTree as ET
              D_NS = 'http://schemas.microsoft.com/ado/2007/08/dataservices'
              M_NS = 'http://schemas.microsoft.com/ado/2007/08/dataservices/metadata'
              ATOM_NS = 'http://www.w3.org/2005/Atom'
              NULL_ATTR = f'{{{M_NS}}}null'
              result = {}
              current_year = datetime.now(timezone.utc).year
              for y in range(years_back + 1):
                  year = current_year - y
                  url = (
                      "https://home.treasury.gov/resource-center/data-chart-center"
                      f"/interest-rates/pages/xml?data=daily_treasury_real_yield_curve&field_tdr_date_value={year}"
                  )
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          text = r.read().decode()
                      if text.count('<entry>') == 0:
                          continue
                      root = ET.fromstring(text)
                      entries = root.findall(f'{{{ATOM_NS}}}entry')
                      if not entries:
                          entries = root.findall('entry')
                      if not entries:
                          entries = [c for c in root if c.tag.endswith('entry')]
                      for entry in entries:
                          props = entry.find(f'.//{{{M_NS}}}properties')
                          if props is None: continue
                          date_el = props.find(f'{{{D_NS}}}NEW_DATE')
                          val_el = props.find(f'{{{D_NS}}}TC_10YEAR')
                          if date_el is None or val_el is None: continue
                          if val_el.get(NULL_ATTR) == 'true': continue
                          date_str = (date_el.text or '')[:10]
                          try:
                              result[date_str] = round(float(val_el.text), 4)
                          except (ValueError, TypeError):
                              pass
                  except Exception as e:
                      print(f"  WARN: Treasury DFII10 {year}: {e}")
              if not result:
                  return None
              return [{"date": k, "val": v} for k, v in sorted(result.items())]

          # ── NY Fed EFFR API ── date-range endpoint, browser headers to avoid block ──
          def fetch_nyfed_effr():
              def _parse_effr(data):
                  rates = data.get("refRates", [])
                  result = []
                  for item in rates:
                      d = item.get("effectiveDate", "")
                      v = item.get("percentRate")
                      if d and v is not None:
                          result.append({"date": d, "val": round(float(v), 4)})
                  result.sort(key=lambda x: x["date"])
                  return result if result else None

              today = datetime.now(timezone.utc)
              start = (today - timedelta(days=400)).strftime("%Y-%m-%d")
              end = today.strftime("%Y-%m-%d")
              browser_hdrs = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                  "Accept": "application/json, */*",
                  "Referer": "https://www.newyorkfed.org/markets/reference-rates/effr",
              }
              for type_path in ["EFFR", "effr"]:
                  url = f"https://markets.newyorkfed.org/api/rates/{type_path}/startDate/{start}/endDate/{end}.json"
                  try:
                      req = urllib.request.Request(url, headers=browser_hdrs)
                      with urllib.request.urlopen(req, timeout=20) as r:
                          data = json.loads(r.read().decode())
                      result = _parse_effr(data)
                      if result:
                          return result
                  except Exception as e:
                      print(f"  WARN: NY Fed EFFR range ({type_path}): {e}")

              for type_path in ["EFFR", "effr"]:
                  for count in [10, 5]:
                      url = f"https://markets.newyorkfed.org/api/rates/{type_path}/last/{count}.json"
                      try:
                          req = urllib.request.Request(url, headers=browser_hdrs)
                          with urllib.request.urlopen(req, timeout=20) as r:
                              data = json.loads(r.read().decode())
                          result = _parse_effr(data)
                          if result:
                              return result
                      except Exception as e:
                          print(f"  WARN: NY Fed EFFR ({type_path}, count={count}): {e}")
              return None

          # ── FRB H.15 release ── Federal Reserve Board DDP (different from FRED) ──
          def fetch_frb_fedfunds():
              url = (
                  "https://www.federalreserve.gov/datadownload/Output.aspx"
                  "?rel=H15&series=bcb44e57fb57efbe1c1819a37cbd7604"
                  "&lastobs=500&startdate=&enddate="
                  "&filepath=h15/h15/H15_FFED_D.txt"
                  "&label=include&layout=seriescolumn&type=package&disclaimer=true"
              )
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      text = r.read().decode()
                  result = []
                  for line in text.strip().split("\n"):
                      line = line.strip().strip('"')
                      parts = line.split(",")
                      if len(parts) == 2:
                          date = parts[0].strip().strip('"')
                          val = parts[1].strip().strip('"')
                          if len(date) == 10 and date[4] == "-" and val not in ("ND", ""):
                              try:
                                  result.append({"date": date, "val": round(float(val), 4)})
                              except ValueError:
                                  pass
                  result.sort(key=lambda x: x["date"])
                  return result[-500:] if result else None
              except Exception as e:
                  print(f"  WARN: FRB H.15 EFFR: {e}")
                  return None

          # ── US Treasury 1-month CMT ── proxy for Fed Funds (within ~10 bps) ──
          def fetch_treasury_1m_yield(years_back=1):
              import xml.etree.ElementTree as ET
              D_NS = 'http://schemas.microsoft.com/ado/2007/08/dataservices'
              M_NS = 'http://schemas.microsoft.com/ado/2007/08/dataservices/metadata'
              ATOM_NS = 'http://www.w3.org/2005/Atom'
              NULL_ATTR = f'{{{M_NS}}}null'
              result = {}
              current_year = datetime.now(timezone.utc).year
              for y in range(years_back + 1):
                  year = current_year - y
                  url = (
                      "https://home.treasury.gov/resource-center/data-chart-center"
                      f"/interest-rates/pages/xml?data=daily_treasury_yield_curve&field_tdr_date_value={year}"
                  )
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          text = r.read().decode()
                      if text.count('<entry>') == 0:
                          continue
                      root = ET.fromstring(text)
                      entries = root.findall(f'{{{ATOM_NS}}}entry')
                      if not entries:
                          entries = root.findall('entry')
                      if not entries:
                          entries = [c for c in root if c.tag.endswith('entry')]
                      for entry in entries:
                          props = entry.find(f'.//{{{M_NS}}}properties')
                          if props is None: continue
                          date_el = props.find(f'{{{D_NS}}}NEW_DATE')
                          if date_el is None: continue
                          val_el = None
                          for field in ['BC_1MONTH', 'BC_1_MONTH', 'BC_1M']:
                              val_el = props.find(f'{{{D_NS}}}{field}')
                              if val_el is not None and val_el.get(NULL_ATTR) != 'true':
                                  break
                          if val_el is None or val_el.get(NULL_ATTR) == 'true': continue
                          date_str = (date_el.text or '')[:10]
                          try:
                              result[date_str] = round(float(val_el.text), 4)
                          except (ValueError, TypeError):
                              pass
                  except Exception as e:
                      print(f"  WARN: Treasury 1M yield {year}: {e}")
              if not result:
                  return None
              return [{"date": k, "val": v} for k, v in sorted(result.items())]

          # ── BLS fix: robust CPI fetch with better error handling ──
          def fetch_bls_cpi_v2():
              # Try GET endpoint first (simpler, more reliable)
              url = "https://api.bls.gov/publicAPI/v1/timeseries/data/CUSR0000SA0"
              for method in ["GET", "POST"]:
                  try:
                      if method == "GET":
                          req = urllib.request.Request(
                              url, headers={"User-Agent": "Mozilla/5.0 (compatible; macro-fetcher)"}
                          )
                      else:
                          req = urllib.request.Request(
                              url,
                              data=json.dumps({"seriesid": ["CUSR0000SA0"]}).encode(),
                              headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"},
                          )
                      with urllib.request.urlopen(req, timeout=30) as r:
                          payload = json.loads(r.read().decode())
                      if payload.get("status") != "REQUEST_SUCCEEDED":
                          print(f"  WARN: BLS status={payload.get('status')} msg={payload.get('message')}")
                          continue
                      rows = payload["Results"]["series"][0]["data"]
                      result = []
                      for row in rows:
                          if row.get("period") == "M13":
                              continue
                          if row.get("value") in ("-", "N/A", ""):   # unreleased month
                              continue
                          month = row["period"][1:]
                          date = f"{row['year']}-{month}-01"
                          result.append({"date": date, "val": float(row["value"])})
                      result.sort(key=lambda x: x["date"])
                      return result if result else None
                  except Exception as e:
                      print(f"  WARN: BLS CPI {method}: {e}")
              return None

          # Load existing data — stale cache beats empty cache
          existing = {}
          try:
              with open("public/macro-data.json") as f:
                  existing = json.load(f)
              print(f"Loaded existing data (updated: {existing.get('updated', 'unknown')})")
          except Exception:
              print("No existing data found, starting fresh")

          new_data = {}
          any_updated = False

          def try_fetch(key, primary_fn, fallback_fn=None, filter_fn=None):
              global any_updated
              result = primary_fn()
              if result is None and fallback_fn:
                  result = fallback_fn()
              if result is not None:
                  if filter_fn:
                      result = [x for x in result if filter_fn(x)]
                  if result:
                      new_data[key] = result
                      print(f"  ✓ {key}: {len(result)} pts, latest={result[-1]}")
                      any_updated = True
                      return
              new_data[key] = existing.get(key, [])
              print(f"  ~ {key}: fetch failed, keeping {len(new_data[key])} existing pts")

          # CPI — BLS v2 primary, original BLS fallback, then Stooq cpiaucsl
          try_fetch("cpi",
              primary_fn=fetch_bls_cpi_v2,
              fallback_fn=lambda: fetch_bls_cpi() or fetch_stooq("cpiaucsl.us", 540))

          # PMI — MPMIVMA stores as decimal (0.487=48.7%); normalize then filter realistic range
          def norm_pmi(data):
              if not data: return None
              result = []
              for x in data:
                  v = x["val"] * 100 if x["val"] < 5 else x["val"]
                  if 30 <= v <= 75:
                      result.append({"date": x["date"], "val": round(v, 1)})
              return result if result else None

          try_fetch("pmi",
              primary_fn=lambda: norm_pmi(fetch_fred_csv("MPMIVMA", 24)),
              fallback_fn=lambda: norm_pmi(fetch_stooq("mpmivma.us", 24)))

          # Fed Funds — NY Fed EFFR primary, FRB H.15/FRED fallbacks,
          # then Treasury 1M CMT as proxy (within ~10 bps of actual Fed Funds rate)
          try_fetch("fedfunds",
              primary_fn=fetch_nyfed_effr,
              fallback_fn=lambda: (
                  fetch_frb_fedfunds() or
                  fetch_fred_csv("FEDFUNDS", 500) or
                  fetch_stooq("fedfunds.us", 500) or
                  fetch_treasury_1m_yield()
              ))

          # 10Y yield — Yahoo Finance primary (reliable), FRED CSV fallback
          # Fetched early so it's available for T10YIE computation below
          try_fetch("dgs10",
              primary_fn=lambda: fetch_yield("%5ETNX", 365),
              fallback_fn=lambda: fetch_fred_csv("DGS10", 365))

          # 2Y yield — Yahoo Finance primary (^IRX ≈ 13-week, best free proxy), FRED fallback
          try_fetch("dgs2",
              primary_fn=lambda: fetch_yield("%5EIRX", 365),
              fallback_fn=lambda: fetch_fred_csv("DGS2", 365))

          # Real yield (TIPS 10Y) — FRED primary, US Treasury XML fallback (same source, no key)
          # Fetched before T10YIE so it's available for the compute fallback below
          try_fetch("dfii10",
              primary_fn=lambda: fetch_fred_csv("DFII10", 540),
              fallback_fn=lambda: fetch_treasury_real_yield_10y() or fetch_stooq("dfii10.us", 540))

          # 10Y breakeven inflation = nominal yield − real yield
          # FRED primary; if blocked, compute from dgs10−dfii10 (both already in new_data)
          def compute_t10yie():
              d10 = {d["date"]: d["val"] for d in new_data.get("dgs10", [])}
              dfi = {d["date"]: d["val"] for d in new_data.get("dfii10", [])}
              if not d10 or not dfi:
                  return None
              result = []
              for date, v10 in d10.items():
                  if date in dfi:
                      bi = round(v10 - dfi[date], 4)
                      if 0 < bi < 5:
                          result.append({"date": date, "val": bi})
              result.sort(key=lambda x: x["date"])
              return result[-540:] if result else None

          try_fetch("t10yie",
              primary_fn=lambda: fetch_fred_csv("T10YIE", 540),
              fallback_fn=lambda: fetch_stooq("t10yie.us", 540) or compute_t10yie())

          # VIX — Yahoo Finance ^VIX (works from GitHub Actions, no CORS block)
          try_fetch("vix",
              primary_fn=lambda: fetch_yahoo("%5EVIX", 60))

          # ── Released values for the calendar ─────────────────────────────────
          #
          # The economic calendar the bot fetches is a SCHEDULE. It carries the
          # forecast and the previous and never the actual — Japan's GDP printed
          # and the field was still empty an hour later — so the app could say a
          # release was coming and never say what it was. The surprise, which is
          # the only part of a release that moves anything, cannot be computed at
          # all without it.
          #
          # BLS publishes the actuals, has no key and no account, and already
          # answers from here — it is the CPI fetcher above. These are the five
          # US releases that move markets most, keyed so the bot can join them to
          # the scheduled event by title.
          def fetch_bls_series(series_id, months=36):
              url = f"https://api.bls.gov/publicAPI/v1/timeseries/data/{series_id}"
              try:
                  req = urllib.request.Request(
                      url,
                      data=json.dumps({"seriesid": [series_id]}).encode(),
                      headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"},
                  )
                  with urllib.request.urlopen(req, timeout=30) as r:
                      payload = json.loads(r.read().decode())
                  rows = payload["Results"]["series"][0]["data"]
                  out = []
                  for row in rows:
                      if row["period"] == "M13" or row.get("value") in ("-", "N/A", ""):
                          continue
                      out.append({
                          "date": f"{row['year']}-{row['period'][1:]}-01",
                          "val": float(row["value"]),
                      })
                  out.sort(key=lambda x: x["date"])
                  return out[-months:] if out else None
              except Exception as e:
                  print(f"  WARN: BLS {series_id}: {e}")
                  return None

          # A month-on-month change, because that is how the calendar quotes most
          # of these — a level is not comparable to a forecast of "0.2%".
          def as_mom_pct(data):
              if not data or len(data) < 2:
                  return None
              out = []
              for i in range(1, len(data)):
                  prev, cur = data[i - 1]["val"], data[i]["val"]
                  if prev:
                      out.append({"date": data[i]["date"], "val": round((cur - prev) / prev * 100, 2)})
              return out or None

          releases = {}
          for key, series, transform in [
              ("cpi_mom",        "CUSR0000SA0",  as_mom_pct),   # CPI m/m
              ("core_cpi_mom",   "CUSR0000SA0L1E", as_mom_pct), # Core CPI m/m
              ("nfp",            "CES0000000001", None),        # Nonfarm payrolls, level
              ("unemployment",   "LNS14000000",  None),         # Unemployment rate
              ("avg_earnings_mom","CES0500000003", as_mom_pct), # Average hourly earnings m/m
          ]:
              raw = fetch_bls_series(series)
              val = transform(raw) if (transform and raw) else raw
              if val:
                  # Payrolls are published as a level; the calendar quotes the
                  # monthly CHANGE, which is what a forecast of "175K" means.
                  if key == "nfp":
                      val = [{"date": val[i]["date"],
                              "val": round((val[i]["val"] - val[i - 1]["val"]) * 1000)}
                             for i in range(1, len(val))]
                  releases[key] = val
                  print(f"  releases.{key}: {len(val)} points, latest {val[-1]}")
              else:
                  print(f"  releases.{key}: unavailable")
          if releases:
              new_data["releases"] = releases
              any_updated = True

          output = {
              "updated": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "any_updated": any_updated,
              **new_data,
          }

          os.makedirs("public", exist_ok=True)
          with open("public/macro-data.json", "w") as f:
              json.dump(output, f, separators=(",", ":"))

          total = sum(len(v) for v in new_data.values() if isinstance(v, list))
          print(f"\nSaved macro-data.json — {total} total data points")
          PYEOF

      - name: Commit and push
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/macro-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update macro data $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"

          # This used to "git pull --rebase origin main" and then a bare "git
          # push" — pulling from one branch and pushing to whichever was checked
          # out. It worked only while the two shared a history. Once they did
          # not, every file the branches had in common came back as an add/add
          # conflict and the job failed twenty-two times in a row.
          #
          # Now it is one branch throughout. The retry is for a different race:
          # the VPS bot commits to main about once a minute, so losing a push is
          # ordinary and is not a reason to leave the file stale for six hours
          # until the next scheduled run.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt lost a race with another commit, rebasing"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "rebase conflict"; exit 1; }
            sleep 3
          done
          echo "could not push after 5 attempts"
          exit 1
